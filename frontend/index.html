<!DOCTYPE html>
<html>
<head>
    <title>AI Chat</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: #e2e8f0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #020617;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .new-chat {
            background: #1e293b;
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .new-chat:hover {
            background: #334155;
        }

        /* Chat area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px 120px;
        }

        .message {
            max-width: 700px;
            margin: 10px auto;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.5;
            animation: fadeIn 0.2s ease-in;
        }

        .user {
            background: #2563eb;
            margin-left: auto;
        }

        .ai {
            background: #1e293b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating input like ChatGPT */
        .input-wrapper {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .input-box {
            width: 700px;
            display: flex;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 10px;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 10px;
        }

        .input-box button {
            background: #22c55e;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .input-box button:hover {
            background: #16a34a;
        }

        .typing {
            max-width: 700px;
            margin: auto;
            opacity: 0.6;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    <div style="opacity:0.6; font-size:12px;">
        Chat history coming soon...
    </div>
</div>

<!-- Main -->
<div class="main">

    <div id="chat" class="chat"></div>

    <div id="typing" class="typing"></div>

    <div class="input-wrapper">
        <div class="input-box">
            <input id="msg" placeholder="Message AI..." />
            <button onclick="send()">Send</button>
        </div>
    </div>

</div>

<script>
const ws = new WebSocket("ws://localhost:8000/ws/chat?token=dev");

const chat = document.getElementById("chat");
const typing = document.getElementById("typing");

let currentAI = null;

ws.onmessage = (event) => {
    const res = JSON.parse(event.data);

    if (res.event === "message:stream") {
        typing.innerText = "AI is thinking...";

        if (!currentAI) {
            currentAI = createMessage("ai", "");
        }

        currentAI.innerText += res.data.chunk;
        chat.scrollTop = chat.scrollHeight;
    }

    if (res.event === "message:receive") {
        typing.innerText = "";
        currentAI = null;
    }
};

function createMessage(role, text) {
    const div = document.createElement("div");
    div.className = "message " + role;
    div.innerText = text;
    chat.appendChild(div);
    return div;
}

function send() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
    if (!text) return;

    createMessage("user", text);

    ws.send(JSON.stringify({
        event: "message:send",
        data: {
            recipient_id: "ai",
            message: text,
            message_type: "text"
        }
    }));

    input.value = "";
}

function newChat() {
    chat.innerHTML = "";
}
    
document.getElementById("msg").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
});
</script>

</body>
</html>
