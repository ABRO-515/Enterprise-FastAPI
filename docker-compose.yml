services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  adminer:
    image: adminer:latest
    ports:
      - "8091:8080"
    depends_on:
      - postgres

  # 🚀 FASTAPI API SERVICE
  api:
    build: .
    env_file:
      - .env
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  # 🚀 WORKER SERVICE
  worker:
    build: .
    command: uv run python -m app.workers.chat_consumer
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis
      - postgres
    restart: always

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: